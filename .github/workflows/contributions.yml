# Rebuilds assets/*.svg from the public contribution calendar.
# Runs on GitHub's servers, not your PC. Bot commits do not count as your contributions.
name: contributions

on:
  schedule:
    - cron: "0 6,12,18 * * *"   # 00:00, 06:00, 12:00 Edmonton (MDT)
  workflow_dispatch:            # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || (git commit -m "Update contributions panel" && git push)
