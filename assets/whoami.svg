<text class="f" style="animation-delay:1.12s" x="380" y="92" font-size="20" font-weight="700" fill="#f0f6fc">Keon Nurse</text>
<text class="f" style="animation-delay:1.24s" x="380" y="118" font-size="13" fill="#8b949e" xml:space="preserve" >Psychology + Computing Science @ UAlberta, class of 2027</text>
<text class="f" style="animation-delay:1.36s" x="380" y="151.6" font-size="13" fill="#c9d1d9" xml:space="preserve" >I build things that light up,</text>
<text class="f" style="animation-delay:1.48s" x="380" y="172.6" font-size="13" fill="#c9d1d9" xml:space="preserve" >and the networks that keep them talking.</text>
